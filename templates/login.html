{% extends "base.html" %}
{% block contenido %}
<div class="auth-wrap">
  <div class="card-fa auth-card">
    <div class="text-center mb-4">
      <span class="brand-dot" style="width:34px;height:34px;font-size:15px;border-radius:9px">F</span>
      <h4 class="mt-3 mb-1">Iniciar sesión</h4>
      <p class="text-muted-f mb-0" style="font-size:13.5px">Accede para reportar y hacer seguimiento.</p>
    </div>

    <form method="POST" novalidate>
      <input type="hidden" name="siguiente" value="{{ siguiente or '' }}">
      <div class="mb-3">
        <label class="form-label-fa" for="correo">Correo</label>
        <input type="email" class="form-control-fa form-control" id="correo" name="correo"
               placeholder="tucorreo@ejemplo.co" required maxlength="150" autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label-fa" for="contrasena">Contraseña</label>
        <input type="password" class="form-control-fa form-control" id="contrasena" name="contrasena"
               placeholder="••••••••" required minlength="8">
      </div>
      <button class="btn btn-primary-fa w-100" type="submit">Entrar</button>
    </form>

    <p class="text-center text-muted-f mt-4 mb-0" style="font-size:13.5px">
      ¿No tienes cuenta? <a href="{{ url_for('r_usuarios.registro') }}">Crear una cuenta</a>
    </p>
  </div>
</div>
{% endblock %}
